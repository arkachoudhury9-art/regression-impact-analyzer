[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "health-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.118.0",
    "httpx>=0.28.1",
    "langchain>=1.4.10",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.7",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.24",
    "langgraph-checkpoint>=4.3.2",
    "langgraph-prebuilt>=1.1.3",
    "langgraph-sdk>=0.4.14",
    "openai>=3.57.0",
    "pymongo>=4.18.3",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.54",
    "typesafe-sdk>=0.7.2",
    "uvicorn[standard]==0.37.0",
]

[tool.setuptools]
py-modules = ["main"]
